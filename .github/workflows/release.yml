name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          targets=(
            "linux amd64"
            "linux arm64"
            "linux 386"
            "linux arm"
          )
          for t in "${targets[@]}"; do
            set -- $t
            GOOS=$1
            GOARCH=$2
            name="debian-network-tui-${VERSION}-${GOOS}-${GOARCH}"
            echo "Building ${name}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${name}" .
            (
              cd dist
              sha256sum "${name}" > "${name}.sha256"
              tar -czf "${name}.tar.gz" "${name}" "${name}.sha256"
            )
          done

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y genisoimage

      - name: Build setup ISO
        run: |
          set -euo pipefail
          chmod +x scripts/build-release-iso.sh
          scripts/build-release-iso.sh "${GITHUB_REF_NAME}" dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.iso
            dist/*.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
